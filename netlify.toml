[build]
  command = "npm run build"
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/assets/content.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
